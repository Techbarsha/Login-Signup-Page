<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #4f3289, #381d63);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: #333;
    }

    .login-container {
      display: flex;
      width: 900px;
      max-width: 90%;
      background: #7c5ac2;
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    .illustration-section {
      width: 55%;
      padding: 50px;
      text-align: center;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .illustration-section img {
      width: 100%;
      max-width: 300px;
      margin-bottom: 20px;
    }

    .illustration-section p {
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.8);
        max-width: 350px;
        margin: 0 auto;
    }

    .login-section {
      width: 45%;
      background: #fff;
      padding: 40px;
      position: relative;
      border-top-left-radius: 60px;
      border-bottom-left-radius: 60px;
    }

    .welcome-tab {
        position: absolute;
        top: 30px;
        left: 0;
        transform: translateX(-50%);
        background: white;
        padding: 10px 25px;
        border-radius: 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        font-weight: 500;
        color: #333;
    }

    .login-section h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-top: 60px;
      margin-bottom: 40px;
      text-align: left;
    }

    .form-group {
      margin-bottom: 30px;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      border: none;
      border-bottom: 1px solid #ccc;
      padding: 8px 0;
      font-size: 1rem;
      outline: none;
    }

    .login-btn {
      display: block;
      width: auto;
      margin: 40px 0;
      padding: 12px 40px;
      border: none;
      border-radius: 25px;
      background: #7c5ac2;
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(124, 90, 194, 0.4);
    }

    .links a {
        display: block;
        color: #888;
        text-decoration: none;
        font-size: 0.9rem;
        margin-bottom: 10px;
    }

    @media (max-width: 992px) {
        .login-container {
            flex-direction: column;
            width: 400px;
        }
        .illustration-section, .login-section {
            width: 100%;
        }
        .login-section {
            border-radius: 0;
            border-top-left-radius: 60px;
            border-top-right-radius: 60px;
        }
        .welcome-tab {
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 15px;
        }
    }

  </style>
</head>
<body>

  <div class="login-container">
    <div class="illustration-section">
      <img src="cartoon.png" alt="Illustration" />
      <p>Lorem ipsum dolor sit amet, consectetuer adipiscing elit, sed diam nonummy nibh euismod tincidunt ut laoreet dolore magna aliquam erat</p>
    </div>
    <div class="login-section">
      <div class="welcome-tab">Welcome back</div>
      <h2>Login your account</h2>
      <form>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password">
        </div>
        <button type="submit" class="login-btn">Login</button>
      </form>
      <div class="links">
        <a href="#">Create Account</a>
        <a href="#">Forgot Password?</a>
      </div>
    </div>
  </div>

</body>
</html>
